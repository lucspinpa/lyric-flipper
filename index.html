<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyric Flipper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0d0d;
    --surface: #141414;
    --border:  #1e1e1e;
    --green:   #1DB954;
    --muted:   #444;
    --text:    #e8e8e0;
    --dim:     #666;
  }

  html, body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; }

  body {
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto auto auto 1fr auto;
    max-width: 1080px;
    margin: 0 auto;
    padding: 3rem 2rem;
    gap: 0 3.5rem;
  }

  /* ── HEADER ── */
  header { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem; margin-bottom: 2rem; }
  .logo { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--green); }
  .logo em { color: var(--muted); font-style: normal; }
  #header-date { font-size: 0.65rem; color: var(--dim); letter-spacing: 0.08em; }

  /* ── NAV TABS ── */
  .nav { grid-column: 1 / -1; display: flex; gap: 2rem; margin-bottom: 0; border-bottom: 1px solid var(--border); }
  .nav-tab { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim); background: none; border: none; border-bottom: 1px solid transparent; padding-bottom: 0.75rem; cursor: pointer; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s; }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--green); }
  .nav-tab:hover:not(.active) { color: var(--text); }

  /* ── TIME RANGE PILLS ── */
  .range-pills { grid-column: 1 / -1; display: flex; gap: 0.5rem; padding-top: 1.75rem; }
  .pill { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); background: none; border: 1px solid var(--border); border-radius: 20px; padding: 0.3rem 0.85rem; cursor: pointer; transition: all 0.15s; }
  .pill.active { color: var(--bg); background: var(--text); border-color: var(--text); }
  .pill:hover:not(.active) { border-color: var(--muted); color: var(--text); }

  /* ── TRACK ROW — formato único ── */
  .track-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.65rem 0.5rem;
    border-bottom: 1px solid var(--border);
    list-style: none;
  }
  .track-row:last-child { border-bottom: none; }
  .track-row.active .t-name { color: var(--green); }
  .t-rank { font-size: 0.6rem; color: var(--muted); min-width: 1.6rem; letter-spacing: 0.05em; flex-shrink: 0; }
  .t-img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; flex-shrink: 0; background: var(--surface); display: block; }
  .t-info { display: flex; flex-direction: column; gap: 0.15rem; overflow: hidden; }
  .t-name { font-size: 0.78rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-artist { font-size: 0.62rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── MAIN areas ── */
  main { grid-column: 1; display: flex; flex-direction: column; justify-content: center; padding: 2rem 0 3rem; min-height: 300px; }
  aside { grid-column: 2; grid-row: 4; border-left: 1px solid var(--border); padding-left: 2rem; padding-top: 2rem; }
  .aside-label { font-size: 0.55rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); margin-bottom: 1rem; }

  /* ── LYRIC ── */
  .song-meta { margin-bottom: 2rem; }
  .song-meta .s-artist { font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--green); margin-bottom: 0.45rem; }
  .song-meta .s-title { font-family: 'DM Serif Display', serif; font-style: italic; font-size: clamp(1.7rem, 3.5vw, 2.6rem); color: var(--text); line-height: 1.15; }
  blockquote { border-left: 1px solid var(--green); padding-left: 1.75rem; font-family: 'DM Serif Display', serif; font-style: italic; font-size: clamp(1.1rem, 2.2vw, 1.4rem); line-height: 1.8; color: var(--text); }
  .sent-badge { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 2rem; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .sent-badge::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

  /* ── ARTISTS ── */
  #artists-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
  .artist-card { display: flex; align-items: center; gap: 0.85rem; padding: 0.65rem; border: 1px solid var(--border); border-radius: 6px; }
  .artist-card.top1 { grid-column: 1 / -1; }
  .a-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--surface); }
  .artist-card.top1 .a-img { width: 52px; height: 52px; }
  .a-info { overflow: hidden; }
  .a-rank { font-size: 0.55rem; color: var(--dim); letter-spacing: 0.08em; margin-bottom: 0.15rem; }
  .a-name { font-size: 0.75rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a-genre { font-size: 0.6rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── SKELETON ── */
  .skel { background: var(--surface); border-radius: 3px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: contents; }

  /* ── FOOTER ── */
  footer { grid-column: 1 / -1; border-top: 1px solid var(--border); padding-top: 1.25rem; margin-top: 3rem; font-size: 0.58rem; color: var(--muted); letter-spacing: 0.08em; display: flex; justify-content: space-between; align-items: center; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--green); }
  #error-msg { display: none; font-size: 0.7rem; color: var(--dim); padding: 2rem 0; grid-column: 1 / -1; }

  /* ── RESPONSIVE ── */
  @media (max-width: 660px) {
    body { grid-template-columns: 1fr; padding: 2rem 1.25rem; gap: 0; }
    aside { grid-column: 1; grid-row: unset; border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 2rem; margin-top: 2rem; }
    #artists-grid { grid-template-columns: 1fr; }
    .artist-card.top1 { grid-column: 1; }
  }

 /* EL CONTENEDOR DEL ESPACIO RETRO */
  #space-sector {
    position: absolute;
    right: -45%;         /* Lo empuja al hueco en blanco de la derecha */
    top: 20%;
    width: 300px;        /* Tamaño perfecto para el cuadrante */
    height: 300px;
    background-image: url('/images/bckg.png');
    background-size: cover;
    image-rendering: pixelated; /* Mantiene el planeta y las estrellas súper nítidos */
    border-radius: 8px;  /* Un toque sutil para los bordes */
    overflow: hidden;    /* Evita que la mascota se salga del recuadro visualmente */
  }
 /* ── NUEVA SECCIÓN PARA LA MASCOTA ── */
     main {
       position: relative; /* Clave para que la mascota no se mueva por toda la pantalla */
     }
     
     #-pet {
       position: absolute;
       right: -40%;         /* Se desplaza hacia el espacio en blanco de la derecha */
       top: 30%;            /* Altura inicial corregida */
       width: 75px;         /* Tamaño ideal para que no pise nada */
       height: auto;
       z-index: 10;
       cursor: pointer;
       transition: top 1s ease-in-out, right 1s ease-in-out, transform 0.3s ease;
     }
     
     #-pet img {
       width: 100%;
       height: auto;
       image-rendering: pixelated; /* Mantiene los píxeles perfectos y nítidos */
     }
     
     /* Estado quieto: Flotando en el sitio como un fantasmita */
     .pet-idle {
       animation: float-around 3s infinite ease-in-out;
     }
     
     @keyframes float-around {
       0%, 100% { transform: translateY(0); }
       50% { transform: translateY(-12px); }
     }
     
     /* Estado movimiento: Se inclina un poco hacia adelante al cambiar de posición */
     .pet-moving {
       animation: wobble 0.3s infinite linear;
     }
     
     @keyframes wobble {
       0%, 100% { transform: rotate(-4deg); }
       50% { transform: rotate(4deg); }
     }
     
     /* Al hacerle click pega un pequeño brinco */
     .pet-click {
       animation: pop 0.4s ease-out;
     }
     
     @keyframes pop {
       0%, 100% { transform: scale(1); }
       50% { transform: scale(1.2); }
     }
     
     /* Ocultar la mascota en pantallas pequeñas (móviles) para que no tape el texto */
     @media (max-width: 768px) {
       #-pet { display: none; }
     }
</style>
</head>
<body>

<header>
  <div class="logo">Lyric<em>/</em>Flipper</div>
  <div id="header-date">cargando…</div>
</header>

<nav class="nav">
  <button class="nav-tab active" data-view="lyric">lyric del día</button>
  <button class="nav-tab" data-view="tracks">top tracks</button>
  <button class="nav-tab" data-view="artists">top artists</button>
</nav>

<div class="range-pills" id="range-pills" style="display:none">
  <button class="pill active" data-range="short_term">last 4 weeks</button>
  <button class="pill" data-range="medium_term">last 6 months</button>
  <button class="pill" data-range="long_term">last 12 months</button>
</div>

<!-- ── VIEW: LYRIC ── -->
<div id="view-lyric" class="view active">
  <main>
    <div class="song-meta">
      <div class="s-artist" id="lyric-artist"><span class="skel" style="width:120px;height:10px;display:inline-block"></span></div>
      <div class="s-title" id="lyric-track"><span class="skel" style="width:280px;height:32px;display:inline-block"></span></div>
    </div>
    <blockquote id="lyric-chunk">
      <span class="skel" style="width:100%;height:16px;display:block;margin-bottom:10px"></span>
      <span class="skel" style="width:85%;height:16px;display:block;margin-bottom:10px"></span>
      <span class="skel" style="width:90%;height:16px;display:block;margin-bottom:10px"></span>
      <span class="skel" style="width:75%;height:16px;display:block;margin-bottom:10px"></span>
      <span class="skel" style="width:80%;height:16px;display:block"></span>
    </blockquote>

   <div id="space-sector">
     <div id="web-pet" class="pet-idle">
       <img src="images/chateau.png" alt="Mascotita">
     </div>
   </div>
    <div class="sent-badge">enviado al flipper zero &amp; iphone</div>
  </main>
  <aside>
    <div class="aside-label">top tracks · last 4 weeks</div>
    <ul id="tracks-list-lyric" style="list-style:none"></ul>
  </aside>
</div>

<!-- ── VIEW: TRACKS ── -->
<div id="view-tracks" class="view">
  <main style="justify-content:flex-start;min-height:unset">
    <ul id="tracks-list-main" style="list-style:none"></ul>
  </main>
  <aside>
    <div class="aside-label" id="tracks-aside-label">&nbsp;</div>
  </aside>
</div>

<!-- ── VIEW: ARTISTS ── -->
<div id="view-artists" class="view">
  <main style="justify-content:flex-start;min-height:unset;display:block;padding:2rem 0 3rem">
    <div id="artists-grid"></div>
  </main>
  <aside>
    <div class="aside-label">géneros frecuentes</div>
    <div id="genres-list" style="display:flex;flex-direction:column;gap:0.6rem;margin-top:0.5rem"></div>
  </aside>
</div>

<div id="error-msg">no se pudo cargar stats.json — ¿se ejecutó el pipeline hoy?</div>

<footer>
  <a href="https://github.com/lucspinpa/lyric-flipper" target="_blank">github.com/lucspinpa/lyric-flipper</a>
  <span id="footer-generated"></span>
</footer>

<script>
(async () => {
  let DATA = null;
  let currentView = 'lyric';
  let currentRange = 'short_term';

  function esc(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function trackRow(t, i, isActive) {
    return `<li class="track-row${isActive ? ' active' : ''}">
      <span class="t-rank">${String(i+1).padStart(2,'0')}</span>
      ${t.image ? `<img class="t-img" src="${esc(t.image)}" alt="" loading="lazy">` : '<span class="t-img"></span>'}
      <span class="t-info">
        <span class="t-name">${esc(t.track)}</span>
        <span class="t-artist">${esc(t.artist)}</span>
      </span>
    </li>`;
  }

  // ── Fetch ──
  try {
    const res = await fetch(`stats.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
  } catch(e) {
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('lyric-chunk').innerHTML = '';
    console.error('stats.json load failed:', e);
    return;
  }

  // ── Header / footer ──
  const dt = new Date(DATA.generated + 'T12:00:00');
  document.getElementById('header-date').textContent =
    dt.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('footer-generated').textContent = 'generado automáticamente · ' + DATA.generated;

  // ── Lyric tab ──
  function renderLyric() {
    document.getElementById('lyric-artist').textContent = DATA.lyric.artist;
    document.getElementById('lyric-track').textContent  = DATA.lyric.track;
    document.getElementById('lyric-chunk').innerHTML =
      DATA.lyric.chunk.split('\n').map(l => `<span>${esc(l)}</span>`).join('<br>');

    const tracks = DATA.tracks.short_term || [];
    document.getElementById('tracks-list-lyric').innerHTML =
      tracks.map((t, i) => trackRow(t, i, t.track === DATA.lyric.track && t.artist === DATA.lyric.artist)).join('');
  }

  // ── Tracks tab — 10 seguidas ──
  function renderTracks(range) {
    const tracks = DATA.tracks[range] || [];
    document.getElementById('tracks-list-main').innerHTML =
      tracks.map((t, i) => trackRow(t, i, false)).join('');
  }

  // ── Artists tab ──
  function renderArtists(range) {
    const artists = DATA.artists[range] || [];

    document.getElementById('artists-grid').innerHTML = artists.map((a, i) => `
      <div class="artist-card${i === 0 ? ' top1' : ''}">
        ${a.image ? `<img class="a-img" src="${esc(a.image)}" alt="" loading="lazy">` : '<span class="a-img"></span>'}
        <div class="a-info">
          <div class="a-rank">${String(i+1).padStart(2,'0')}</div>
          <div class="a-name">${esc(a.name)}</div>
          ${a.genres && a.genres.length ? `<div class="a-genre">${a.genres.map(esc).join(' · ')}</div>` : ''}
        </div>
      </div>`).join('');

    const genreCount = {};
    artists.forEach(a => (a.genres || []).forEach(g => { genreCount[g] = (genreCount[g]||0) + 1; }));
    const sorted = Object.entries(genreCount).sort((a,b) => b[1]-a[1]).slice(0, 8);
    const max = sorted[0]?.[1] || 1;
    document.getElementById('genres-list').innerHTML = sorted.map(([g, c]) => `
      <div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:0.62rem;color:var(--text)">${esc(g)}</span>
          <span style="font-size:0.55rem;color:var(--dim)">${c}</span>
        </div>
        <div style="height:2px;background:var(--border);border-radius:2px">
          <div style="height:100%;width:${Math.round(c/max*100)}%;background:var(--green);border-radius:2px"></div>
        </div>
      </div>`).join('');
  }

  // ── Initial render ──
  renderLyric();
  renderTracks('short_term');
  renderArtists('short_term');

  // ── Nav tabs ──
  document.querySelectorAll('.nav-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.dataset.view;
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + currentView).classList.add('active');
      document.getElementById('range-pills').style.display = currentView === 'lyric' ? 'none' : 'flex';
    });
  });

  // ── Range pills ──
  document.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      currentRange = btn.dataset.range;
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (currentView === 'tracks')  renderTracks(currentRange);
      if (currentView === 'artists') renderArtists(currentRange);
    });
  });



 // ── COMPORTAMIENTO DE LA MASCOTA ──
  const pet = document.getElementById('web-pet');
  
  function moveMascotRandomly() {
    if (document.getElementById('view-lyric').classList.contains('active')) {
      pet.className = 'pet-moving';

      const randomRight = Math.floor(Math.random() * (-15 - (-45)) + (-45)); // Entre -15% y -45%
      const randomTop = Math.floor(Math.random() * (55 - 15) + 15);          // Entre 15% y 55%

      const currentRight = parseFloat(pet.style.right) || 12;
      if (randomRight > currentRight) {
        pet.style.transform = 'scaleX(-1)'; 
      } else {
        pet.style.transform = 'scaleX(1)';  
      }

      pet.style.right = `${randomRight}%`;
      pet.style.top = `${randomTop}%`;

      setTimeout(() => {
        pet.className = 'pet-idle';
      }, 1000);
    }
  }

  function startPetBehavior() {
    const nextMoveTime = Math.random() * (9000 - 5000) + 5000;
    setTimeout(() => {
      moveMascotRandomly();
      startPetBehavior();
    }, nextMoveTime);
  }

  pet.addEventListener('click', () => {
    pet.className = 'pet-click';
    setTimeout(() => {
      pet.className = 'pet-idle';
    }, 400);
  });

  startPetBehavior();

})(); // <-- Asegúrate de que este cierre de la función asíncrona esté justo aquí
</script>
</body>
</html>
