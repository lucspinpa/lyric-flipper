<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top Tracks</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
</head>
<body>
  <header><div class="logo">Lyric<em>/</em>sh0p1t</div></header>
  
  <nav class="nav">
    <a href="index.html" class="nav-tab">lyric del día</a>
    <a href="tracks.html" class="nav-tab active">top tracks</a>
    <a href="artists.html" class="nav-tab">top artists</a>
    <a href="tarot.html" class="nav-tab">tarot arcana</a>
    <!--<a href="pinterest.html" class="nav-tab">pinterest boards</a>-->
  </nav>

  <div class="range-pills" style="display:flex">
    <button class="pill active" data-range="short_term">last 4 weeks</button>
    <button class="pill" data-range="medium_term">last 6 months</button>
    <button class="pill" data-range="long_term">last 12 months</button>
  </div>

  <div class="tab-view-extended">
    <ul id="tracks-list-main" style="list-style:none"></ul>
  </div>

  <aside class="aside-extended" style="padding-left: 2.5rem;">
    <div class="aside-label" id="tracks-aside-label">top tracks · last 4 weeks</div>
  </aside>

  <script>
    (async () => {
      let DATA = null;

      function esc(str) {
        if (!str) return '';
        return str.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
      }

      function trackRow(t, i) {
        return `<li class="track-row">
          <span class="t-rank">${String(i+1).padStart(2,'0')}</span>
          ${t.image ? `<img class="t-img" src="${esc(t.image)}" alt="" loading="lazy">` : '<span class="t-img" style="background:var(--surface)"></span>'}
          <span class="t-info"><span class="t-name">${esc(t.track)}</span><span class="t-artist">${esc(t.artist)}</span></span>
        </li>`;
      }

      async function renderTracks(range) {
        const tracks = DATA.tracks[range] || [];
        document.getElementById('tracks-list-main').innerHTML = tracks.map((t, i) => trackRow(t, i)).join('');
        document.getElementById('tracks-aside-label').textContent = 'top tracks · ' + (range === 'short_term' ? 'last 4 weeks' : range === 'medium_term' ? 'last 6 months' : 'last 12 months');
      }

      // Cargar datos
      try {
        const res = await fetch(`stats.json?t=${Date.now()}`);
        DATA = await res.json();
        renderTracks('short_term');
      } catch(e) {
        console.error("Error cargando stats:", e);
      }

      // Lógica de los botones
      document.querySelectorAll('.pill').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderTracks(btn.dataset.range);
        });
      });
    })();
  </script>
</body>
</html>
