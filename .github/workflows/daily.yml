name: Lyric of the Day

on:
  schedule:
    # Cada día a las 9:00 hora de España (8:00 UTC en invierno, 7:00 UTC en verano)
    # Ajusta el horario aquí: https://crontab.guru
    - cron: '27 08 * * *'
  # Permite ejecutarlo manualmente desde GitHub para probar
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para el git push
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Trae el historial completo para que el push funcione sin problemas de historial
          fetch-depth: 0
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install spotipy lyricsgenius requests pyserial beautifulsoup4
 
      - name: Restore Spotify token cache
        # El token se guarda como secret en GitHub para que el runner
        # pueda autenticarse sin intervención manual
        env:
          SPOTIFY_TOKEN_CACHE: ${{ secrets.SPOTIFY_TOKEN_CACHE }}
        run: |
          if [ -n "$SPOTIFY_TOKEN_CACHE" ]; then
            echo "$SPOTIFY_TOKEN_CACHE" > .spotify_token_cache
            echo "✅ Token cache restaurado."
          else
            echo "⚠️  SPOTIFY_TOKEN_CACHE no configurado — el pipeline fallará en el módulo 1."
          fi
 
      - name: Run pipeline
        env:
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GENIUS_ACCESS_TOKEN:   ${{ secrets.GENIUS_ACCESS_TOKEN }}
          NTFY_TOPIC:            ${{ secrets.NTFY_TOPIC }}
        run: python lyric_flipper.py
 
      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Añade los archivos si existen (evita fallos si alguno no se generó aún)
          git add lyric_of_day.txt stats.json index.html .lyric_state.json 2>/dev/null || true
          
          # Comprueba si hay cambios antes de hacer commit y push explícito a la rama activa
          if ! git diff --cached --quiet; then
            git commit -m "chore: lyric of the day $(date +'%Y-%m-%d') [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No hay cambios generados hoy para subir."
          fi
