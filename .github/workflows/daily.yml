name: Lyric of the Day

on:
  schedule:
    # Cada día a las 9:00 hora de España (8:00 UTC en invierno, 7:00 UTC en verano)
    # Ajusta el horario aquí: https://crontab.guru
    - cron: '0 8 * * *'
  # Permite ejecutarlo manualmente desde GitHub para probar
  workflow_dispatch:

jobs:
  send-lyric:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar token de Spotify
        # Escribe el token cacheado desde los secrets de GitHub
        run: |
          echo '${{ secrets.SPOTIFY_TOKEN_CACHE }}' > .spotify_token_cache

      - name: Ejecutar pipeline
        env:
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI:  ${{ secrets.SPOTIFY_REDIRECT_URI }}
          NTFY_TOPIC:            ${{ secrets.NTFY_TOPIC }}
        run: python lyric_flipper.py

      - name: Actualizar token de Spotify en secrets
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          pip install PyNaCl --quiet

          python3 - <<'EOF'
          import os, json, base64
          from pathlib import Path
          from nacl import encoding, public
          import urllib.request

          token = os.environ["PAT_TOKEN"]
          repo  = os.environ["REPO"]
          cache = Path(".spotify_token_cache").read_text().strip()
          if not cache:
              print("Cache vacío, nada que guardar.")
              exit(0)

          # Obtener clave pública del repo
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}
          )
          with urllib.request.urlopen(req) as r:
              pk_data = json.loads(r.read())

          # Cifrar el secret con la clave pública
          pub_key = public.PublicKey(pk_data["key"].encode(), encoding.Base64Encoder())
          sealed = public.SealedBox(pub_key).encrypt(cache.encode())
          encrypted = base64.b64encode(sealed).decode()

          # Actualizar el secret
          body = json.dumps({"encrypted_value": encrypted, "key_id": pk_data["key_id"]}).encode()
          req2 = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/SPOTIFY_TOKEN_CACHE",
              data=body,
              method="PUT",
              headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json"
              }
          )
          with urllib.request.urlopen(req2) as r:
              print(f"Token actualizado correctamente (status {r.status})")
          EOF
