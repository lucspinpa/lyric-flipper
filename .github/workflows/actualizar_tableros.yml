name: Actualizar Tableros de Pinterest

on:
  schedule:
    # Se ejecutará automáticamente todos los días a las 00:00 UTC
    - cron: '17 0 * * *'
  workflow_dispatch:
    # Esto te permite activar el script manualmente desde GitHub con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar el código de tu repositorio en la máquina virtual de GitHub
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Instalar las librerías necesarias para tu script
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Ejecutar el Scraper forzando el método de la API directamente
    - name: Ejecutar Scraper de Pinterest (Modo API)
      env:
        PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      run: |
        python -c "
        from pinterest_scraper import PinterestScraper
        scraper = PinterestScraper('lucaspineirop')
        print('🔐 Conectando de forma segura mediante la API...')
        if scraper.fetch_boards_api():
            if scraper.save_to_json('pinterest_data.json'):
                scraper.print_summary()
                print('✨ ¡Listo!')
            else:
                import sys; sys.exit(1)
        else:
            import sys; sys.exit(1)
        "

    # 5. Guardar el archivo 'pinterest_data.json' generado y subirlo a tu repositorio
    - name: Hacer commit y push de los nuevos datos
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add pinterest_data.json
        # Solo sube cambios si el archivo JSON realmente cambió
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de tableros" && git push)
