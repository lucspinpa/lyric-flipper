name: Actualizar Tableros de Pinterest

on:
  schedule:
    # Se ejecutará automáticamente todos los días a las 00:00 UTC
    - cron: '17 0 * * *'
  workflow_dispatch:
    # Esto te permite activar el script manualmente desde GitHub con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar el código de tu repositorio en la máquina virtual de GitHub
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Instalar las librerías necesarias para tu script
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Ejecutar el Scraper adaptado a la API v5 de Pinterest
    - name: Ejecutar Scraper de Pinterest (Modo API v5)
      env:
        PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      run: |
        python -c "
        import requests
        import json
        import sys

        token = '${{ secrets.PINTEREST_TOKEN }}'
        username = 'lucaspineirop'
        
        print('🔐 Conectando de forma segura mediante la API v5 moderna...')
        
        # URL oficial de la API v5 para obtener los tableros del usuario autenticado
        url = 'https://api.pinterest.com/v5/boards'
        headers = {
            'Authorization': f'Bearer {token}',
            'Content-Type': 'application/json'
        }
        
        try:
            response = requests.get(url, headers=headers, timeout=10)
            response.raise_for_status()
            
            data = response.json()
            items = data.get('items', [])
            
            processed_boards = []
            for board in items:
                processed = {
                    'id': board.get('id', ''),
                    'name': board.get('name', 'Sin nombre'),
                    'description': board.get('description', '') or '',
                    'image_url': board.get('media', {}).get('image_cover_url', '') or '',
                    'pin_count': 0,  # La API v5 requiere endpoints separados para conteos, dejamos valor base
                    'collaborators_count': 1,
                    'is_owner': True,
                    'url': f'https://pinterest.com/{username}/{board.get(\"name\", \"\").lower().replace(\" \", \"-\")}'
                }
                processed_boards.append(processed)
            
            if not processed_boards:
                print('⚠️ No se encontraron tableros en la respuesta de la API.')
                sys.exit(1)
                
            with open('pinterest_data.json', 'w', encoding='utf-8') as f:
                json.dump(processed_boards, f, ensure_ascii=False, indent=2)
                
            print(f'✅ ¡Éxito! Se han guardado {len(processed_boards)} tableros en pinterest_data.json')
            
        except requests.RequestException as e:
            print(f'❌ Error con API v5: {e}')
            if e.response is not None:
                print(f'Respuesta del servidor: {e.response.text}')
            sys.exit(1)
        "

    # 5. Guardar el archivo 'pinterest_data.json' generado y subirlo a tu repositorio
    - name: Hacer commit y push de los nuevos datos
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add pinterest_data.json
        # Solo sube cambios si el archivo JSON realmente cambió
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de tableros" && git push)
