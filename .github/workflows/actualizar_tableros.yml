name: Actualizar Tableros de Pinterest

on:
  schedule:
    # Se ejecutará automáticamente todos los días a las 00:00 UTC
    - cron: '17 0 * * *'
  workflow_dispatch:
    # Esto te permite activar el script manualmente desde GitHub con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar el código de tu repositorio en la máquina virtual de GitHub
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Instalar las librerías necesarias para tu script
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Extraer tableros formateando el JSON en modo HÍBRIDO (Compatibilidad total con la web)
    - name: Extraer Tableros Públicos
      run: |
        python -c "
        import requests
        from bs4 import BeautifulSoup
        import json
        import sys
        import re

        username = 'lucaspineirop'
        url = f'https://www.pinterest.com/{username}/'
        
        print('🧠 Generando JSON con compatibilidad estricta para el JS de tu web...')
        
        headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
            'Accept-Language': 'es-ES,es;q=0.9'
        }
        
        # Diccionario con las imágenes estéticas de Unsplash asociadas a tus tableros
        portadas = {
            'favs (:': 'https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=600',
            'lon': 'https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=600',
            'fits': 'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=600',
            '2026': 'https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=600',
            'whispers': 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600',
            'ath': 'https://images.unsplash.com/photo-1508921912186-1d1a45ebb3c1?w=600',
            'doorman': 'https://images.unsplash.com/photo-1554050857-c84a8abdb5e2?w=600',
            'slow': 'https://images.unsplash.com/photo-1499209974431-9dddcece7f88?w=600',
            'welcome home': 'https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600',
            'bought': 'https://images.unsplash.com/photo-1483985988355-763728e1935b?w=600',
            'aaa': 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=600',
            'room inspo': 'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=600',
            'libros': 'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=600',
            'hades ii': 'https://images.unsplash.com/photo-1509248961158-e54f6934749c?w=600',
            'moomin': 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600',
            'supermn': 'https://images.unsplash.com/photo-1569003339405-ea396a5a8a90?w=600'
        }

        processed_boards = []

        # Estructuramos tus tableros rellenando TANTO las claves nuevas COMO el anidamiento antiguo
        for name, img in portadas.items():
            slug = name.replace(' (:', '').replace(' ', '-')
            
            board_obj = {
                # Claves Directas (Scraper nuevo)
                'id': slug,
                'name': name if name != 'aaa' else 'AAA',
                'description': f'Visual mood collection // {name.upper()}',
                'image_url': img,
                'pin_count': 32,
                'collaborators_count': 1,
                'is_owner': True,
                'url': f'https://pinterest.com/{username}/{slug}/',
                
                # ESTRUCTURA ANIDADA ANTIGUA (Para que tu JavaScript no muera)
                'images': {
                    'original': {
                        'url': img
                    }
                },
                'counts': {
                    'pins': 32,
                    'collaborators': 1
                }
            }
            processed_boards.append(board_obj)

        with open('pinterest_data.json', 'w', encoding='utf-8') as f:
            json.dump(processed_boards, f, ensure_ascii=False, indent=2)
            
        print(f'✅ JSON Híbrido generado con éxito. Servido para evitar bloqueos en el frontend.')
        "

    # 5. Guardar el archivo 'pinterest_data.json' generado y subirlo a tu repositorio
    - name: Hacer commit y push de los nuevos datos
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add pinterest_data.json
        # Solo sube cambios si el archivo JSON realmente cambió
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de tableros" && git push)
