name: Actualizar Tableros de Pinterest

on:
  schedule:
    # Se ejecutará automáticamente todos los días a las 00:00 UTC
    - cron: '17 0 * * *'
  workflow_dispatch:
    # Esto te permite activar el script manualmente desde GitHub con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar el código de tu repositorio en la máquina virtual de GitHub
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Instalar las librerías necesarias para tu script
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Ejecutar tu script pasándole tu usuario y usando el secreto guardado
    - name: Ejecutar Scraper de Pinterest
      env:
        PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      run: |
        python pinterest_scraper.py lucaspineirop

    # 5. Guardar el archivo 'pinterest_data.json' generado y subirlo a tu repositorio
    - name: Hacer commit y push de los nuevos datos
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add pinterest_data.json
        # Solo sube cambios si el archivo JSON realmente cambió
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de tableros" && git push)
